# GPIO
CONFIG_GPIO=y

# I2C (400 kHz configured in DT overlay)
CONFIG_I2C=y

# UART for diagnostics
CONFIG_SERIAL=y

# Watchdog (3 s timeout)
CONFIG_WATCHDOG=y

# Pin control (needed for I2C1 / UART0 pin mapping)
CONFIG_PINCTRL=y

# Reset-cause detection
CONFIG_HWINFO=y

# Console / printk
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Main thread stack (default 1024 is too small for EEPROM + telemetry buffers)
CONFIG_MAIN_STACK_SIZE=2048

# Float support in scanf / sscanf (picolibc)
CONFIG_PICOLIBC_IO_FLOAT=y
